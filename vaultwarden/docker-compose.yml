services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SIGNUPS_ALLOWED=false
    #ports:
    #  - "8222:80"
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true