services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "3000:3000/tcp"
    volumes:
      - ${DATA_DIR}/adguardhome/conf:/opt/adguardhome/conf
      - ${DATA_DIR}/adguardhome/work:/opt/adguardhome/work
