services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"
      #- "443:443/udp"
    volumes:
      - ${HOMELAB_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
